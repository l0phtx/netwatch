[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netwatch"
dynamic = ["version"]
description = "Network discovery tool that maps devices and open ports and alerts when an unknown device joins."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "l0phtx" }]
keywords = ["security", "network", "scapy", "arp", "asset-inventory", "blue-team"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["scapy>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
netwatch = "netwatch.cli:main"

[project.urls]
Homepage = "https://github.com/l0phtx/netwatch"
Issues = "https://github.com/l0phtx/netwatch/issues"

[tool.hatch.version]
path = "src/netwatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/netwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
